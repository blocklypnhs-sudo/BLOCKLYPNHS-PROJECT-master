<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Module Locked · BlockLearn</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/mobile_responsive.css" rel="stylesheet">
    <script defer src="/static/js/portal_consistency.js"></script>
</head>
<body class="bg-light">
  <main class="container py-5" style="max-width:720px">
    <div class="alert alert-warning shadow-sm">
      <h1 class="h4"><i class="fas fa-lock"></i> Module {{ module_number }} is locked</h1>
      <p class="mb-3">Pass {{ language|title }} Module {{ previous_module_number }} to unlock this module.</p>
      <a class="btn btn-success" href="/student_modules/{{ language }}/{{ previous_module_number }}">Continue previous module</a>
      <a class="btn btn-outline-secondary" href="/student_modules">All modules</a>
    </div>
  </main>
</body>
</html>
