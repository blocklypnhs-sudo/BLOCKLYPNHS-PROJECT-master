<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assessment Locked · BlockLearn</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/mobile_responsive.css" rel="stylesheet">
    <script defer src="/static/js/portal_consistency.js"></script>
</head>
<body class="bg-light">
  <main class="container py-5" style="max-width:720px">
    <div class="alert alert-warning shadow-sm">
      <h1 class="h4">Assessment {{ previous_number + 1 }} is locked</h1>
      <p class="mb-3">Pass {{ language_name }} Assessment {{ previous_number }} with at least 8/10 to unlock this set.</p>
      <a class="btn btn-success" href="{{ overview_url }}">Back to {{ language_name }} assessments</a>
    </div>
  </main>
</body>
</html>
