<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge — {{ badge.label }}</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #eef2f7 0%, #dde6f3 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
    margin: 0;
  }
  .badge-card {
    background: #fff;
    max-width: 480px;
    width: 100%;
    padding: 48px 36px 40px;
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.12);
    text-align: center;
  }
  .medal {
    width: 140px;
    height: 140px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffd966, #c9a227 70%, #8a6d0f);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 68px;
    box-shadow: 0 8px 24px rgba(201,162,39,0.4), inset 0 -6px 12px rgba(0,0,0,0.15);
  }
  h1 { font-size: 26px; color: #1a2740; margin-bottom: 8px; }
  .type {
    text-transform: uppercase;
    letter-spacing: 3px;
    font-size: 11px;
    color: #999;
    margin-bottom: 20px;
  }
  .desc { color: #555; font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
  .earned-date {
    display: inline-block;
    background: #f0f5fb;
    border: 1px solid #d5e2f0;
    border-radius: 20px;
    padding: 8px 18px;
    font-size: 13px;
    color: #1a2740;
    margin-bottom: 24px;
  }
  .back-btn {
    display: inline-block;
    padding: 11px 26px;
    background: #1a2740;
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    font-size: 14px;
  }
  .back-btn:hover { background: #2a3a5a; }
</style>
    <link href="/static/mobile_responsive.css" rel="stylesheet">
    <script defer src="/static/js/portal_consistency.js"></script>
</head>
<body>
<main class="badge-card">
  <div class="medal" aria-hidden="true">🏅</div>
  <h1>{{ badge.label }}</h1>
  <div class="type">{{ badge.language|capitalize }} {{ 'Assessment' if badge.language in ('python', 'java') else 'Activity' }} Badge</div>
  <p class="desc">You successfully passed {{ badge.label }}.</p>
  {% if badge.earned_at %}
    <div class="earned-date">Earned on {{ badge.earned_at }}</div>
  {% endif %}
  <a href="/student_dashboard" class="back-btn">Back to Dashboard</a>
</main>
</body>
</html>
