<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C++ Playground · BlockLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/blockly/8.0.4/blockly.min.js"></script>
    <script src="/static/js/score_breakdown.js"></script>
    <script src="/static/js/learning_timer.js"></script>
    <script src="/static/js/activity_session.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f6f3; min-height: 100vh; }

        :root {
            --cpp-main: #004482;
            --cpp-deep: #003366;
            --cpp-light: #e8edf3;
            --green-deep: #145a42;
            --green-main: #145a42;
            --green-light: #28a87a;
            --green-soft: #e2f3ed;
            --gold-warm: #e8a838;
            --coral: #e06050;
            --coral-soft: #fce8e5;
            --stone: #7f9e92;
            --border-fresh: #dde9e3;
            --card-white: #ffffff;
            --bg-main: #f0f6f3;
            --text-primary: #1a463a;
            --text-secondary: #4a6b5e;
            --shadow-sm: 0 4px 16px rgba(20, 90, 66, 0.06);
            --shadow-md: 0 8px 28px rgba(20, 90, 66, 0.08);
            --shadow-lg: 0 16px 48px rgba(20, 90, 66, 0.12);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.6);
            --card-glass: rgba(255, 255, 255, 0.85);
        }

        .container-custom {
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px 24px;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-xl);
            padding: 0.4rem 1.5rem;
            margin-bottom: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
        }
        .page-title {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.3px;
            margin: 0;
        }
        .page-title i {
            color: var(--cpp-main);
            margin-right: 8px;
        }
        .playground-close {
            background: var(--coral-soft);
            color: var(--coral);
            border: none;
            padding: 4px 14px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            font-weight: 600;
            font-size: 12px;
            line-height: 1.4;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .playground-close:hover {
            background: var(--coral);
            color: white;
        }

        /* ===== ACTIVITY SELECTOR ===== */
        .activity-selector {
            background: var(--card-glass);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            padding: 10px 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
        }
        .activity-selector .title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--stone);
            margin-bottom: 8px;
        }
        .activity-selector .title i {
            color: var(--cpp-main);
            margin-right: 4px;
        }
        .activity-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .activity-btn {
            padding: 5px 14px;
            border-radius: 40px;
            border: 1.5px solid var(--border-fresh);
            background: white;
            font-weight: 600;
            font-size: 11px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            position: relative;
        }
        .activity-btn:hover {
            border-color: var(--cpp-main);
            color: var(--text-primary);
        }
        .activity-btn.active {
            background: var(--cpp-main);
            border-color: var(--cpp-main);
            color: white;
        }
        .activity-btn.activity-locked,
        .activity-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            filter: grayscale(0.35);
        }
        .activity-lock-label {
            font-size: 9px;
            font-weight: 700;
            color: #a33a2e;
        }
        .activity-btn .difficulty-tag {
            font-size: 9px;
            padding: 1px 7px;
            border-radius: 20px;
            font-weight: 700;
        }
        .difficulty-easy { background: #d1fae5; color: #065f46; }
        .difficulty-medium { background: #fef3c7; color: #b45309; }
        .difficulty-hard { background: #fee2e2; color: #991b1b; }
        .activity-btn.active .difficulty-tag {
            background: rgba(255,255,255,0.3);
            color: white;
        }

        /* ===== ACTIVITY BANNER ===== */
        .activity-banner {
            background: linear-gradient(125deg, var(--cpp-deep), var(--cpp-main));
            border-radius: var(--radius-lg);
            padding: 14px 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 14px;
            box-shadow: 0 8px 18px rgba(0, 68, 130, 0.2);
        }
        .activity-banner-info {
            flex: 1;
            min-width: 280px;
        }
        .activity-banner-info h4 {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 6px;
            color: white;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .activity-banner-info h4 .difficulty-tag {
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 700;
        }
        .activity-banner-info .instructions {
            font-size: 12px;
            opacity: 0.95;
            margin: 0 0 8px 0;
            color: #f5f5ff;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        .activity-banner-info .instructions code {
            background: rgba(255,255,255,0.15);
            padding: 1px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 11px;
        }
        .activity-guide {
            margin: 8px 0 10px;
            padding: 8px 10px;
            border-left: 3px solid #fbbf24;
            border-radius: 7px;
            background: rgba(255,255,255,0.12);
        }
        .activity-guide .label {
            display: block;
            margin-bottom: 2px;
            color: #fde68a;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .activity-guide .text {
            margin: 0;
            color: #fff;
            font-size: 11px;
            line-height: 1.45;
        }
        .activity-banner-info .expected-output-box {
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 6px 14px;
            display: inline-block;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .activity-banner-info .expected-output-box .label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.75;
            display: block;
            margin-bottom: 2px;
            color: #f5f5ff;
        }
        .activity-banner-info .expected-output-box .value {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            color: #4ade80;
            font-weight: 700;
            white-space: pre-wrap;
        }
        .btn-clear-activity {
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            color: white;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .btn-clear-activity:hover { background: rgba(255,255,255,0.35); }

        /* ===== WORKSPACE PANEL ===== */
        .workspace-panel {
            background: var(--card-glass);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ===== WORKSPACE TOOLBAR ===== */
        .workspace-toolbar {
            padding: 8px 16px;
            border-bottom: 1px solid var(--border-fresh);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            background: var(--bg-main);
        }
        .workspace-toolbar .lang-badge {
            background: var(--cpp-light);
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 10px;
            font-weight: 600;
            color: var(--cpp-deep);
        }
        .workspace-toolbar .actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .workspace-toolbar .actions button {
            padding: 3px 12px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .btn-run { background: var(--green-main); color: white; }
        .btn-run:hover { background: var(--green-deep); }
        .btn-clear { background: var(--coral-soft); color: var(--coral); }
        .btn-clear:hover { background: var(--coral); color: white; }
        .btn-submit { background: var(--gold-warm); color: #1a4235; }
        .btn-submit:hover { background: #d49a2a; }

        /* ===== WORKSPACE WRAPPER ===== */
        .workspace-wrapper {
            height: 400px;
            min-height: 400px;
            max-height: 540px;
            overflow: hidden;
            position: relative;
        }
        #blocklyDiv {
            height: 100%;
            width: 100%;
            min-height: 400px;
            max-height: 540px;
            background: #fefefb;
        }

        /* ===== OUTPUT PANEL ===== */
        .output-panel {
            padding: 8px 16px 12px;
            border-top: 1px solid var(--border-fresh);
            background: #1a2d27;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .output-panel .output-row {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            flex-wrap: wrap;
        }
        .output-panel .output-col {
            flex: 1;
            min-width: 120px;
        }
        .output-panel .label {
            font-size: 9px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.6px;
            color: #8fb8a8;
            margin-bottom: 1px;
        }
        .output-panel .output-text {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12.5px;
            color: #bbf0e0;
            min-height: 20px;
            line-height: 1.5;
            word-break: break-all;
            white-space: pre-wrap;
        }
        .output-panel .output-text.success { color: #4ade80; }
        .output-panel .output-text.error { color: #f87171; }

        /* ===== TOAST ===== */
        @keyframes tIn {
            0% { opacity: 0; transform: translateX(40px) scale(0.95); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        #toastBox {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast-msg {
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            animation: tIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transition: all 0.3s ease;
        }
        .toast-msg.success { background: #1a463a; color: white; }
        .toast-msg.error { background: #dc2626; color: white; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .container-custom { padding: 12px 10px; }
            .activity-header { padding: 10px 14px; }
            .activity-header .left h3 { font-size: 13px; }
            .workspace-wrapper { height: 260px; min-height: 260px; }
            #blocklyDiv { min-height: 260px; max-height: 360px; }
            .output-panel .output-row { flex-direction: column; gap: 6px; }
            .activity-banner { padding: 12px 14px; }
            .activity-banner-info h4 { font-size: 13px; }
            .activity-banner-info .instructions { font-size: 11px; }
        }
        @media (max-width: 576px) {
            .workspace-toolbar { flex-direction: column; align-items: stretch; }
            .workspace-toolbar .actions { justify-content: center; }
            .top-bar { padding: 0.3rem 1rem; }
            .page-title { font-size: 0.85rem; }
        }
    </style>
<script src="/static/js/blockly_code_preview.js"></script>
</head>
<body>

    <div class="container-custom">
        <!-- Top Bar -->
        <div class="top-bar">
            <div>
                <p class="page-title"><i class="fas fa-plus-circle"></i>C++ Playground</p>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <button class="playground-close" onclick="window.location.href='/student_activities_cpp'">
                    <i class="fas fa-times"></i> Close
                </button>
            </div>
        </div>

        <!-- Activity Selector -->
        <div class="activity-selector">
            <div class="title"><i class="fas fa-graduation-cap"></i> C++ Activities</div>
            <div class="activity-btns">
                <button class="activity-btn active" data-activity="hello-cpp" onclick="loadActivity('hello-cpp')">
                    <i class="fas fa-terminal"></i> Hello C++
                    <span class="difficulty-tag difficulty-easy">Easy</span>
                </button>
                <button class="activity-btn" data-activity="store-age" onclick="loadActivity('store-age')">
                    <i class="fas fa-cube"></i> Store Age
                    <span class="difficulty-tag difficulty-easy">Easy</span>
                </button>
                <button class="activity-btn" data-activity="multiply-numbers" onclick="loadActivity('multiply-numbers')">
                    <i class="fas fa-calculator"></i> Multiply Numbers
                    <span class="difficulty-tag difficulty-medium">Medium</span>
                </button>
                <button class="activity-btn" data-activity="less-than" onclick="loadActivity('less-than')">
                    <i class="fas fa-code-branch"></i> Less Than
                    <span class="difficulty-tag difficulty-medium">Medium</span>
                </button>
                <button class="activity-btn" data-activity="display-numbers" onclick="loadActivity('display-numbers')">
                    <i class="fas fa-list-ol"></i> Display Numbers
                    <span class="difficulty-tag difficulty-hard">Hard</span>
                </button>
                <button class="activity-btn" data-activity="free-play" onclick="loadActivity('free-play')">
                    <i class="fas fa-play"></i> Free Play
                </button>
            </div>
        </div>

        <!-- Activity Banner (INSTRUCTIONS / GUIDE) -->
        <div class="activity-banner" id="activityBanner">
            <div class="activity-banner-info">
                <h4>
                    <i class="fas fa-code"></i>
                    <span id="bannerActivityName">Hello C++</span>
                    <span class="difficulty-tag difficulty-easy" id="bannerDifficulty">Easy</span>
                </h4>
                <p class="instructions" id="bannerInstructions">Build a C++ program that prints "Hello, C++!"</p>
                <div class="activity-guide">
                    <span class="label"><i class="fas fa-lightbulb me-1"></i>Clue</span>
                    <p class="text" id="bannerGuide">Use cout with a TEXT block connected inside it.</p>
                </div>
                <div class="expected-output-box">
                    <span class="label"><i class="fas fa-eye me-1"></i>Expected Output</span>
                    <span class="value" id="bannerExpectedOutput">"Hello, C++!"</span>
                </div>
            </div>
            <button class="btn-clear-activity" onclick="clearWorkspace()">
                <i class="fas fa-times me-1"></i> Clear
            </button>
        </div>

        <!-- Workspace Panel -->
        <div class="workspace-panel">
            <div class="workspace-toolbar">
                <span class="lang-badge"><i class="fas fa-plus-circle me-1"></i> C++</span>
                <div class="actions">
                    <button class="btn-clear" onclick="clearWorkspace()"><i class="fas fa-trash-alt me-1"></i> Clear</button>
                    <button class="btn-run" onclick="runCppCode()"><i class="fas fa-play me-1"></i> Run</button>
                    <button class="btn-submit" onclick="saveCppPractice()"><i class="fas fa-paper-plane me-1"></i> Submit</button>
                </div>
            </div>
            <div class="workspace-wrapper">
                <div id="blocklyDiv"></div>
            </div>
            <!-- Output Panel -->
            <div class="output-panel">
                <div class="output-row">
                    <div class="output-col">
                        <div class="label"><i class="fas fa-terminal me-1"></i> Your Output</div>
                        <div class="output-text" id="outputArea">Run your code to see output</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toastBox"></div>

    <script>
        // ============================================================
        // BLOCK REGISTRATION
        // ============================================================
        console.log('Blockly version:', Blockly.version || 'unknown');

        Blockly.Blocks['cpp_cout'] = {
            init: function() {
                this.appendValueInput('TEXT').setCheck(['String', 'Number']).appendField('cout <<');
                this.setInputsInline(true);
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour('#004482');
                this.setTooltip('Print to console in C++');
            }
        };

        Blockly.Blocks['cpp_variable'] = {
            init: function() {
                this.appendDummyInput()
                    .appendField(new Blockly.FieldDropdown([
                        ['int', 'int'], ['double', 'double'], ['string', 'string'], ['bool', 'bool']
                    ]), 'TYPE')
                    .appendField(new Blockly.FieldTextInput('myVar'), 'NAME')
                    .appendField('=');
                this.appendValueInput('VALUE');
                this.setInputsInline(true);
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour('#8b5cf6');
                this.setTooltip('Create a C++ variable');
            }
        };

        Blockly.Blocks['cpp_variable_get'] = {
            init: function() {
                this.appendDummyInput().appendField('get variable').appendField(new Blockly.FieldTextInput('myVar'), 'NAME');
                this.setOutput(true, ['String', 'Number']);
                this.setColour('#8b5cf6');
                this.setTooltip('Get variable value');
            }
        };

        Blockly.Blocks['cpp_math_operation'] = {
            init: function() {
                this.appendValueInput('A').setCheck('Number').appendField('math');
                this.appendDummyInput().appendField(new Blockly.FieldDropdown([
                    ['+', 'ADD'], ['-', 'SUBTRACT'], ['×', 'MULTIPLY'], ['÷', 'DIVIDE']
                ]), 'OP');
                this.appendValueInput('B').setCheck('Number').appendField('');
                this.setInputsInline(true);
                this.setOutput(true, 'Number');
                this.setColour('#10b981');
                this.setTooltip('Perform math operation');
            }
        };

        Blockly.Blocks['cpp_number'] = {
            init: function() {
                this.appendDummyInput().appendField(new Blockly.FieldNumber(0, -Infinity, Infinity, 1), 'NUM');
                this.setOutput(true, 'Number');
                this.setColour('#10b981');
                this.setTooltip('A number');
            }
        };

        Blockly.Blocks['cpp_text'] = {
            init: function() {
                this.appendDummyInput().appendField(new Blockly.FieldTextInput(''), 'TEXT');
                this.setOutput(true, 'String');
                this.setColour('#8b5cf6');
                this.setTooltip('A text string');
            }
        };

        Blockly.Blocks['cpp_if'] = {
            init: function() {
                this.appendValueInput('IF0').setCheck('Boolean').appendField('if');
                this.appendStatementInput('DO0').appendField('then');
                this.appendStatementInput('ELSE').appendField('else');
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour('#f0b84d');
                this.setTooltip('If-Else statement in C++');
            }
        };

        Blockly.Blocks['cpp_compare'] = {
            init: function() {
                this.appendValueInput('A').setCheck(['Number', 'String']);
                this.appendDummyInput().appendField(new Blockly.FieldDropdown([
                    ['=', 'EQ'], ['≠', 'NEQ'], ['>', 'GT'], ['<', 'LT'], ['≥', 'GTE'], ['≤', 'LTE']
                ]), 'OP');
                this.appendValueInput('B').setCheck(['Number', 'String']);
                this.setInputsInline(true);
                this.setOutput(true, 'Boolean');
                this.setColour('#f0b84d');
                this.setTooltip('Compare two values');
            }
        };

        Blockly.Blocks['cpp_for'] = {
            init: function() {
                this.appendDummyInput().appendField('for (int ').appendField(new Blockly.FieldTextInput('i'), 'VAR').appendField('=');
                this.appendValueInput('FROM').setCheck('Number');
                this.appendDummyInput().appendField('; ').appendField(new Blockly.FieldTextInput('i'), 'VAR2').appendField('<= ');
                this.appendValueInput('TO').setCheck('Number');
                this.appendDummyInput().appendField('; ').appendField(new Blockly.FieldTextInput('i'), 'VAR3').appendField('++) {');
                this.appendStatementInput('DO').appendField('body');
                this.appendDummyInput().appendField('}');
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour('#d97706');
                this.setTooltip('For loop in C++');
            }
        };

        // ============================================================
        // JAVASCRIPT GENERATORS (Translates to C++ style)
        // ============================================================
        if (typeof Blockly.JavaScript === 'undefined') {
            try {
                var jsGenerator = Blockly.Generator.getGenerator('JavaScript');
                if (jsGenerator) {
                    for (var key in jsGenerator) {
                        Blockly.JavaScript = Blockly.JavaScript || {};
                        Blockly.JavaScript[key] = jsGenerator[key];
                    }
                }
            } catch(e) { console.error('Failed to get JavaScript generator:', e); }
        }

        if (Blockly.JavaScript) {
            Blockly.JavaScript['cpp_cout'] = function(block) {
                var text = Blockly.JavaScript.valueToCode(block, 'TEXT', Blockly.JavaScript.ORDER_ATOMIC) || '""';
                return 'cout << ' + text + ';\n';
            };
            Blockly.JavaScript['cpp_variable'] = function(block) {
                var type = block.getFieldValue('TYPE');
                var name = block.getFieldValue('NAME');
                var value = Blockly.JavaScript.valueToCode(block, 'VALUE', Blockly.JavaScript.ORDER_ATOMIC) || '0';
                if (type === 'string') value = Blockly.JavaScript.valueToCode(block, 'VALUE', Blockly.JavaScript.ORDER_ATOMIC) || '""';
                if (type === 'bool') value = Blockly.JavaScript.valueToCode(block, 'VALUE', Blockly.JavaScript.ORDER_ATOMIC) || 'false';
                return type + ' ' + name + ' = ' + value + ';\n';
            };
            Blockly.JavaScript['cpp_variable_get'] = function(block) {
                var name = block.getFieldValue('NAME');
                return [name, Blockly.JavaScript.ORDER_ATOMIC];
            };
            Blockly.JavaScript['cpp_math_operation'] = function(block) {
                var a = Blockly.JavaScript.valueToCode(block, 'A', Blockly.JavaScript.ORDER_ATOMIC) || '0';
                var b = Blockly.JavaScript.valueToCode(block, 'B', Blockly.JavaScript.ORDER_ATOMIC) || '0';
                var op = block.getFieldValue('OP');
                var symbol = op === 'ADD' ? '+' : op === 'SUBTRACT' ? '-' : op === 'MULTIPLY' ? '*' : '/';
                return ['(' + a + ' ' + symbol + ' ' + b + ')', Blockly.JavaScript.ORDER_ATOMIC];
            };
            Blockly.JavaScript['cpp_number'] = function(block) {
                return [block.getFieldValue('NUM'), Blockly.JavaScript.ORDER_ATOMIC];
            };
            Blockly.JavaScript['cpp_text'] = function(block) {
                var text = block.getFieldValue('TEXT') || '';
                return ['"' + text + '"', Blockly.JavaScript.ORDER_ATOMIC];
            };
            Blockly.JavaScript['cpp_compare'] = function(block) {
                var a = Blockly.JavaScript.valueToCode(block, 'A', Blockly.JavaScript.ORDER_ATOMIC) || '0';
                var b = Blockly.JavaScript.valueToCode(block, 'B', Blockly.JavaScript.ORDER_ATOMIC) || '0';
                var op = block.getFieldValue('OP');
                var symbol = op === 'EQ' ? '==' : op === 'NEQ' ? '!=' : op === 'GT' ? '>' : op === 'LT' ? '<' : op === 'GTE' ? '>=' : '<=';
                return ['(' + a + ' ' + symbol + ' ' + b + ')', Blockly.JavaScript.ORDER_ATOMIC];
            };
            Blockly.JavaScript['cpp_if'] = function(block) {
                var condition = Blockly.JavaScript.valueToCode(block, 'IF0', Blockly.JavaScript.ORDER_ATOMIC) || 'false';
                var doCode = Blockly.JavaScript.statementToCode(block, 'DO0') || '';
                var elseCode = Blockly.JavaScript.statementToCode(block, 'ELSE') || '';
                var code = 'if (' + condition + ') {\n' + doCode + '}';
                if (elseCode) code += ' else {\n' + elseCode + '}';
                return code + '\n';
            };
            Blockly.JavaScript['cpp_for'] = function(block) {
                var varName = block.getFieldValue('VAR');
                var from = Blockly.JavaScript.valueToCode(block, 'FROM', Blockly.JavaScript.ORDER_ATOMIC) || '0';
                var to = Blockly.JavaScript.valueToCode(block, 'TO', Blockly.JavaScript.ORDER_ATOMIC) || '0';
                var doCode = Blockly.JavaScript.statementToCode(block, 'DO') || '';
                return 'for (int ' + varName + ' = ' + from + '; ' + varName + ' <= ' + to + '; ' + varName + '++) {\n' + doCode + '}\n';
            };
        }

        // ===== BLOCKLY SETUP =====
        let workspace;
        let currentActivity = 'hello-cpp';

        // ===== ACTIVITY CONFIGURATIONS =====
        const cppActivities = {
            'hello-cpp': {
                name: 'Hello C++',
                difficulty: 'Easy',
                step: 1,
                toolboxCategories: ['CPP Basic'],
                blocksXml: `<xml xmlns="https://developers.google.com/blockly/xml"></xml>`,
                instructions: `TASK: Print "Hello, C++!" to the console.\n\nBLOCKS NEEDED: cout, TEXT\n\nSTEPS:\n1. Drag cout from BASIC\n2. Drag TEXT from BASIC and attach INSIDE cout\n3. Type "Hello, C++!" in TEXT\n4. Click RUN CODE`,
                guide: 'BASIC: connect a TEXT block inside cout, then enter "Hello, C++!".',
                expected: '"Hello, C++!"'
            },
            'store-age': {
                name: 'Store Age',
                difficulty: 'Easy',
                step: 2,
                toolboxCategories: ['CPP Basic', 'CPP Variables', 'CPP Math'],
                blocksXml: `<xml xmlns="https://developers.google.com/blockly/xml"></xml>`,
                instructions: `TASK: Create a variable called "age" with value 17 and print it.\n\nBLOCKS NEEDED: int variable, cout, NUMBER, GET VARIABLE\n\nSTEPS:\n1. Drag "int myVar =" from VARIABLES\n2. Change "myVar" to "age"\n3. Attach a NUMBER block from MATH with value 17\n4. Drag cout from BASIC\n5. Drag GET VARIABLE from VARIABLES into cout\n6. Change GET VARIABLE to "age"\n7. Click RUN CODE`,
                guide: 'VARIABLES: set int age to 17. BASIC: put get variable age inside cout.',
                expected: '17'
            },
            'multiply-numbers': {
                name: 'Multiply Numbers',
                difficulty: 'Medium',
                step: 3,
                toolboxCategories: ['CPP Basic', 'CPP Math'],
                blocksXml: `<xml xmlns="https://developers.google.com/blockly/xml"></xml>`,
                instructions: `TASK: Multiply 6 × 5 and print the result.\n\nBLOCKS NEEDED: cout, math operation, number\n\nSTEPS:\n1. Drag cout from BASIC\n2. Inside cout, add the math block from MATH and choose ×\n3. Add two number blocks from MATH: 6 and 5\n4. Click RUN CODE`,
                guide: 'MATH: choose multiplication and connect 6 and 5. Put the math result inside BASIC cout.',
                expected: '30'
            },
            'less-than': {
                name: 'Less Than',
                difficulty: 'Medium',
                step: 4,
                toolboxCategories: ['CPP Basic', 'CPP Math', 'CPP Logic'],
                blocksXml: `<xml xmlns="https://developers.google.com/blockly/xml"></xml>`,
                instructions: `TASK: Check if 15 is less than 20. If true, print "15 is less than 20".\n\nBLOCKS NEEDED: if, compare, cout, number, text\n\nSTEPS:\n1. Drag if and compare from LOGIC; choose <\n2. Add number blocks from MATH: 15 and 20\n3. Inside if, add cout from BASIC with a BASIC TEXT block containing "15 is less than 20"\n4. Click RUN CODE`,
                guide: 'LOGIC: compare 15 < 20. Inside IF, place BASIC cout with the message in a TEXT block.',
                expected: '15 is less than 20'
            },
            'display-numbers': {
                name: 'Display Numbers',
                difficulty: 'Hard',
                step: 5,
                toolboxCategories: ['CPP Basic', 'CPP Math', 'CPP Variables', 'CPP Loops'],
                blocksXml: `<xml xmlns="https://developers.google.com/blockly/xml"></xml>`,
                instructions: `TASK: Display numbers 1 to 5 using a for loop.\n\nBLOCKS NEEDED: for loop, number, cout, GET VARIABLE\n\nSTEPS:\n1. Drag the for loop block from LOOPS\n2. Set the counter names to "i"\n3. Drag NUMBER blocks from MATH into the FROM and TO inputs; set them to 1 and 5\n4. Drag cout from BASIC into the loop body\n5. Drag GET VARIABLE from VARIABLES into cout and set its name to "i"\n6. Click RUN CODE`,
                guide: 'LOOPS: count with i from 1 to 5. Inside the loop, put get variable i inside BASIC cout.',
                expected: '1\n2\n3\n4\n5'
            },
            'free-play': {
                name: 'Free Play',
                difficulty: 'All Levels',
                step: 0,
                toolboxCategories: ['All'],
                blocksXml: `<xml xmlns="https://developers.google.com/blockly/xml"></xml>`,
                instructions: `TASK: Build anything you want!\n\nAvailable blocks:\nBASIC: cout, TEXT\nMATH: math, number\nVARIABLES: int myVar =, get variable\nLOGIC: if, compare\nLOOPS: for loop\n\nTry creating:\n- Calculator with +, -, ×, ÷\n- Any math expression\n- Variables with different values\n- If-else conditions`,
                guide: 'Start with BASIC cout and TEXT. Add MATH, VARIABLES, LOGIC, or LOOPS to build a larger program.',
                expected: 'Your Code'
            }
        };

        // ===== TOOLBOX GENERATOR =====
        function getCppToolbox(categories) {
            const allCategories = {
                'CPP Basic': `
                    <category name="BASIC" colour="#004482">
                        <block type="cpp_cout"></block>
                        <block type="cpp_text"></block>
                    </category>`,
                'CPP Math': `
                    <category name="MATH" colour="#10b981">
                        <block type="cpp_math_operation"></block>
                        <block type="cpp_number"></block>
                    </category>`,
                'CPP Variables': `
                    <category name="VARIABLES" colour="#8b5cf6">
                        <block type="cpp_variable"></block>
                        <block type="cpp_variable_get"></block>
                    </category>`,
                'CPP Logic': `
                    <category name="LOGIC" colour="#f0b84d">
                        <block type="cpp_if"></block>
                        <block type="cpp_compare"></block>
                    </category>`,
                'CPP Loops': `
                    <category name="LOOPS" colour="#d97706">
                        <block type="cpp_for"></block>
                    </category>`
            };

            if (categories.includes('All')) {
                return `
                    <xml xmlns="https://developers.google.com/blockly/xml" id="toolbox" style="display: none;">
                        ${allCategories['CPP Basic']}
                        ${allCategories['CPP Math']}
                        ${allCategories['CPP Variables']}
                        ${allCategories['CPP Logic']}
                        ${allCategories['CPP Loops']}
                    </xml>`;
            }

            let toolboxXml = '<xml xmlns="https://developers.google.com/blockly/xml" id="toolbox" style="display: none;">';
            categories.forEach(cat => {
                if (allCategories[cat]) toolboxXml += allCategories[cat];
            });
            toolboxXml += '</xml>';
            return toolboxXml;
        }

        // ===== BLOCKLY INITIALIZATION =====
        function initBlockly(toolboxXml) {
            if (workspace) { workspace.dispose(); workspace = null; }

            workspace = Blockly.inject('blocklyDiv', {
                toolbox: toolboxXml,
                trashcan: true,
                zoom: { controls: true, wheel: true, startScale: 0.9 },
                renderer: 'zelos'
            });
            window.attachBlocklyCodePreview(
                workspace,
                'blocklyDiv',
                () => Blockly.JavaScript.workspaceToCode(workspace),
                'Generated JavaScript'
            );

            setTimeout(() => {
                document.querySelectorAll('.blocklyTrash').forEach(el => {
                    el.style.opacity = '1';
                    el.style.transition = 'all 0.3s ease';
                });
            }, 200);

            window.addEventListener('resize', () => {
                if (workspace) Blockly.svgResize(workspace);
            });
        }

        // ===== ACTIVITY LOADING =====
        async function loadActivity(activityId, userInitiated = true) {
            const activity = cppActivities[activityId];
            if (!activity) return;
            try {
                await window.ActivitySession.start(activityId, userInitiated);
            } catch (error) {
                showToast(error.message, 'error');
                return;
            }
            currentActivity = activityId;

            document.querySelectorAll('.activity-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.activity === activityId);
            });

            document.getElementById('bannerActivityName').textContent = activity.name;
            
            const diffTag = document.getElementById('bannerDifficulty');
            diffTag.textContent = activity.difficulty;
            diffTag.className = 'difficulty-tag';
            if (activity.difficulty === 'Easy') diffTag.classList.add('difficulty-easy');
            else if (activity.difficulty === 'Medium') diffTag.classList.add('difficulty-medium');
            else if (activity.difficulty === 'Hard') diffTag.classList.add('difficulty-hard');
            else diffTag.classList.add('difficulty-easy');
            
            const taskPrompt = activity.instructions.split(/\n\s*\n/)[0].replace(/^TASK:\s*/, '');
            document.getElementById('bannerInstructions').textContent = taskPrompt;
            document.getElementById('bannerGuide').textContent = activity.guide;
            document.getElementById('bannerExpectedOutput').textContent = activity.expected || '—';

            const toolboxXml = getCppToolbox(activity.toolboxCategories);
            initBlockly(toolboxXml);

            setTimeout(() => {
                try {
                    if (workspace && activity.blocksXml) {
                        const xmlDom = Blockly.Xml.textToDom(activity.blocksXml);
                        Blockly.Xml.domToWorkspace(xmlDom, workspace);
                        Blockly.svgResize(workspace);
                    }
                    document.getElementById('outputArea').textContent = 'Run your code to see output';
                    document.getElementById('outputArea').className = 'output-text';
                } catch(e) { console.error('Failed to load activity blocks:', e); }
            }, 100);
        }

        // ===== WORKSPACE CONTROLS =====
        function clearWorkspace() {
            if (confirm('Clear all blocks from workspace?')) {
                try {
                    if (workspace) {
                        workspace.clear();
                        document.getElementById('outputArea').textContent = 'Workspace cleared';
                        document.getElementById('outputArea').className = 'output-text';
                    }
                } catch(e) { console.error('Error clearing workspace:', e); }
            }
        }

        // ===== RUN CODE =====
        function runCppCode() {
            const outputArea = document.getElementById('outputArea');
            try {
                if (!workspace) {
                    outputArea.textContent = 'Workspace not initialized.';
                    outputArea.className = 'output-text error';
                    return;
                }
                if (typeof Blockly.JavaScript === 'undefined') {
                    outputArea.textContent = 'C++ generator not available.';
                    outputArea.className = 'output-text error';
                    return;
                }

                let code = Blockly.JavaScript.workspaceToCode(workspace);

                if (!code || code.trim() === '') {
                    outputArea.textContent = 'No code to run. Build your solution first!';
                    outputArea.className = 'output-text error';
                    return;
                }

                const originalConsoleLog = console.log;
                window.lastCppOutput = '';

                try {
                    let consoleOutput = [];
                    console.log = function(...args) { consoleOutput.push(args.join(' ')); };

                    // Convert C++ syntax to executable JS for the browser
                    const executableCode = code
                        .replace(/\b(int|double|string|bool)\s+/g, 'let ')
                        .replace(/\bcout\s*<<\s*(.+?);/g, 'console.log($1);');

                    eval(executableCode);

                    if (consoleOutput.length > 0) {
                        window.lastCppOutput = consoleOutput.join('\n');
                        outputArea.textContent = consoleOutput.join('\n');
                        outputArea.className = 'output-text success';
                    } else {
                        outputArea.textContent = 'Code ran successfully but no output was printed.';
                        outputArea.className = 'output-text';
                    }
                } catch(e) {
                    outputArea.textContent = 'Execution error: ' + e.message;
                    outputArea.className = 'output-text error';
                } finally {
                    console.log = originalConsoleLog;
                }
            } catch(e) {
                outputArea.textContent = 'Error: ' + e.message;
                outputArea.className = 'output-text error';
            }
        }

        // ===== SUBMIT CODE =====
        function saveCppPractice() {
            if (!workspace) { alert('Workspace not ready.'); return; }
            if (typeof Blockly.JavaScript === 'undefined') { alert('C++ generator not available.'); return; }

            let code = Blockly.JavaScript.workspaceToCode(workspace).trim();
            if (!code) { alert('Build your solution before submitting!'); return; }

            const activityNumbers = {
                'hello-cpp': 1,
                'store-age': 2,
                'multiply-numbers': 3,
                'less-than': 4,
                'display-numbers': 5
            };
            const assessmentNumber = activityNumbers[currentActivity];
            if (!assessmentNumber) {
                alert('Free Play cannot be submitted as an assessment.');
                return;
            }

            const codeBlocks = Blockly.Xml.domToText(Blockly.Xml.workspaceToDom(workspace));
            const output = window.lastCppOutput || '';

            const submitBtn = document.querySelector('.btn-submit');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Submitting...';
            submitBtn.disabled = true;

            fetch('/submit_activity', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    language: 'cpp',
                    assessment_number: assessmentNumber,
                    code_blocks: codeBlocks,
                    generated_code: code,
                    output: output,
                    duration_seconds: window.getLearningDurationSeconds()
                })
            })
            .then(response => {
                if (!response.ok) return response.text().then(text => { throw new Error(text || `HTTP ${response.status}`); });
                return response.json();
            })
            .then(async result => {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;

                if (result.success) {
                    const earnedPoints = result.points || 0;
                    const maxPoints = result.max_points || 0;
                    window.showScoreAttemptFeedback(result, result.activity_title || currentActivity);
                    await window.ActivitySession.submitted(result);
                    showToast(`Submitted ${earnedPoints}/${maxPoints}`, result.points === result.max_points ? 'success' : 'error');
                    try { localStorage.setItem('student_dashboard_refresh', Date.now().toString()); } catch(e) {}
                    try { localStorage.setItem('progress_updated', Date.now().toString()); } catch(e) {}
                } else {
                    showToast(result.message || 'Submission failed.', 'error');
                }
            })
            .catch(error => {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
                console.error('Submit activity failed:', error);
                showToast('Unable to submit. Please try again.', 'error');
            });
        }

        // ===== TOAST =====
        function showToast(message, type) {
            const box = document.getElementById('toastBox');
            const toast = document.createElement('div');
            toast.className = 'toast-msg ' + type;
            toast.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${message}`;
            box.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(40px)';
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        }

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('Page loaded - initializing...');
            const requestedActivity = new URLSearchParams(window.location.search).get('activity');
            const activityId = Object.prototype.hasOwnProperty.call(cppActivities, requestedActivity)
                ? requestedActivity
                : 'hello-cpp';
            await window.ActivitySession.initialize('cpp', cppActivities);
            loadActivity(activityId, false);
        });
    </script>
