<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Playground · BlockLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/blockly/8.0.4/blockly.min.js"></script>
    <script src="/static/js/score_breakdown.js"></script>
    <script src="/static/js/learning_timer.js"></script>
    <script src="/static/js/activity_session.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f6f3; min-height: 100vh; }

        :root {
            --js-main: #f7df1e;
            --js-deep: #d4b80a;
            --js-light: #fef9e7;
            --green-deep: #145a42;
            --green-main: #145a42;
            --green-light: #28a87a;
            --green-soft: #e2f3ed;
            --gold-warm: #e8a838;
            --coral: #e06050;
            --coral-soft: #fce8e5;
            --stone: #7f9e92;
            --border-fresh: #dde9e3;
            --card-white: #ffffff;
            --bg-main: #f0f6f3;
            --text-primary: #1a463a;
            --text-secondary: #4a6b5e;
            --shadow-sm: 0 4px 16px rgba(20, 90, 66, 0.06);
            --shadow-md: 0 8px 28px rgba(20, 90, 66, 0.08);
            --shadow-lg: 0 16px 48px rgba(20, 90, 66, 0.12);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.6);
            --card-glass: rgba(255, 255, 255, 0.85);
        }

        .container-custom {
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px 24px;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-xl);
            padding: 0.4rem 1.5rem;
            margin-bottom: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
        }
        .page-title {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.3px;
            margin: 0;
        }
        .page-title i {
            color: var(--js-main);
            margin-right: 8px;
        }
        .playground-close {
            background: var(--coral-soft);
            color: var(--coral);
            border: none;
            padding: 4px 14px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            font-weight: 600;
            font-size: 12px;
            line-height: 1.4;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .playground-close:hover {
            background: var(--coral);
            color: white;
        }

        /* ===== ACTIVITY SELECTOR ===== */
        .activity-selector {
            background: var(--card-glass);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            padding: 10px 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
        }
        .activity-selector .title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--stone);
            margin-bottom: 8px;
        }
        .activity-selector .title i {
            color: var(--js-main);
            margin-right: 4px;
        }
        .activity-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .activity-btn {
            padding: 5px 14px;
            border-radius: 40px;
            border: 1.5px solid var(--border-fresh);
            background: white;
            font-weight: 600;
            font-size: 11px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            position: relative;
        }
        .activity-btn:hover {
            border-color: var(--js-main);
            color: var(--text-primary);
        }
        .activity-btn.active {
            background: var(--js-main);
            border-color: var(--js-main);
            color: #1a4235;
        }
        .activity-btn.activity-locked,
        .activity-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            filter: grayscale(0.35);
        }
        .activity-lock-label {
            font-size: 9px;
            font-weight: 700;
            color: #a33a2e;
        }
        .activity-btn .difficulty-tag {
            font-size: 9px;
            padding: 1px 7px;
            border-radius: 20px;
            font-weight: 700;
        }
        .difficulty-easy { background: #d1fae5; color: #065f46; }
        .difficulty-medium { background: #fef3c7; color: #b45309; }
        .difficulty-hard { background: #fee2e2; color: #991b1b; }
        .activity-btn.active .difficulty-tag {
            background: rgba(255,255,255,0.4);
            color: #1a4235;
        }

        /* ===== ACTIVITY BANNER ===== */
        .activity-banner {
            background: linear-gradient(125deg, #d4b80a, var(--js-main));
            border-radius: var(--radius-lg);
            padding: 14px 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 14px;
            box-shadow: 0 8px 18px rgba(212, 184, 10, 0.2);
        }
        .activity-banner-info {
            flex: 1;
            min-width: 280px;
        }
        .activity-banner-info h4 {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #1a4235;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .activity-banner-info h4 .difficulty-tag {
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 700;
        }
        .activity-banner-info .instructions {
            font-size: 12px;
            opacity: 0.95;
            margin: 0 0 8px 0;
            color: #2a3a2f;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        .activity-banner-info .instructions code {
            background: rgba(0,0,0,0.08);
            padding: 1px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 11px;
        }
        .activity-guide {
            margin: 8px 0 10px;
            padding: 8px 10px;
            border-left: 3px solid #7a0523;
            border-radius: 7px;
            background: rgba(255,255,255,0.45);
        }
        .activity-guide .label {
            display: block;
            margin-bottom: 2px;
            color: #7a0523;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .activity-guide .text {
            margin: 0;
            color: #24352e;
            font-size: 11px;
            line-height: 1.45;
        }
        .activity-banner-info .expected-output-box {
            background: rgba(255,255,255,0.4);
            border-radius: 10px;
            padding: 6px 14px;
            display: inline-block;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .activity-banner-info .expected-output-box .label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
            display: block;
            margin-bottom: 2px;
            color: #2a3a2f;
        }
        .activity-banner-info .expected-output-box .value {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            color: #1a4235;
            font-weight: 700;
            white-space: pre-wrap;
        }
        .btn-clear-activity {
            background: rgba(0,0,0,0.1);
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            color: #1a4235;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .btn-clear-activity:hover { background: rgba(0,0,0,0.2); }

        /* ===== WORKSPACE PANEL ===== */
        .workspace-panel {
            background: var(--card-glass);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ===== WORKSPACE TOOLBAR ===== */
        .workspace-toolbar {
            padding: 8px 16px;
            border-bottom: 1px solid var(--border-fresh);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            background: var(--bg-main);
        }
        .workspace-toolbar .lang-badge {
            background: var(--js-light);
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 10px;
            font-weight: 600;
            color: var(--js-deep);
        }
        .workspace-toolbar .actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .workspace-toolbar .actions button {
            padding: 3px 12px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .btn-run { background: var(--green-main); color: white; }
        .btn-run:hover { background: var(--green-deep); }
        .btn-clear { background: var(--coral-soft); color: var(--coral); }
        .btn-clear:hover { background: var(--coral); color: white; }
        .btn-submit { background: var(--gold-warm); color: #1a4235; }
        .btn-submit:hover { background: #d49a2a; }

        /* ===== WORKSPACE WRAPPER ===== */
        .workspace-wrapper {
            height: 400px;
            min-height: 400px;
            max-height: 540px;
            overflow: hidden;
            position: relative;
        }
        #blocklyDiv {
            height: 100%;
            width: 100%;
            min-height: 400px;
            max-height: 540px;
            background: #fefefb;
        }

        /* ===== OUTPUT PANEL ===== */
        .output-panel {
            padding: 8px 16px 12px;
            border-top: 1px solid var(--border-fresh);
            background: #1a2d27;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .output-panel .output-row {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            flex-wrap: wrap;
        }
        .output-panel .output-col {
            flex: 1;
            min-width: 120px;
        }
        .output-panel .label {
            font-size: 9px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.6px;
            color: #8fb8a8;
            margin-bottom: 1px;
        }
        .output-panel .output-text {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12.5px;
            color: #bbf0e0;
            min-height: 20px;
            line-height: 1.5;
            word-break: break-all;
            white-space: pre-wrap;
        }
        .output-panel .output-text.success { color: #4ade80; }
        .output-panel .output-text.error { color: #f87171; }

        /* ===== TOAST ===== */
        @keyframes tIn {
            0% { opacity: 0; transform: translateX(40px) scale(0.95); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        #toastBox {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast-msg {
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            animation: tIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transition: all 0.3s ease;
        }
        .toast-msg.success { background: #1a463a; color: white; }
        .toast-msg.error { background: #dc2626; color: white; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .container-custom { padding: 12px 10px; }
            .activity-header { padding: 10px 14px; }
            .activity-header .left h3 { font-size: 13px; }
            .workspace-wrapper { height: 260px; min-height: 260px; }
            #blocklyDiv { min-height: 260px; max-height: 360px; }
            .output-panel .output-row { flex-direction: column; gap: 6px; }
            .activity-banner { padding: 12px 14px; }
            .activity-banner-info h4 { font-size: 13px; }
            .activity-banner-info .instructions { font-size: 11px; }
        }
        @media (max-width: 576px) {
            .workspace-toolbar { flex-direction: column; align-items: stretch; }
            .workspace-toolbar .actions { justify-content: center; }
            .top-bar { padding: 0.3rem 1rem; }
            .page-title { font-size: 0.85rem; }
        }
    </style>
<script src="/static/js/blockly_code_preview.js"></script>
</head>
<body>

    <div class="container-custom">
        <!-- Top Bar -->
        <div class="top-bar">
            <div>
                <p class="page-title"><i class="fab fa-js"></i>JavaScript Playground</p>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <button class="playground-close" onclick="window.location.href='/student_activities_javascript'">
                    <i class="fas fa-times"></i> Close
                </button>
            </div>
        </div>

        <!-- Activity Selector -->
        <div class="activity-selector">
            <div class="title"><i class="fas fa-graduation-cap"></i> JavaScript Activities</div>
            <div class="activity-btns">
                <button class="activity-btn active" data-activity="hello-js" onclick="loadActivity('hello-js')">
                    <i class="fas fa-terminal"></i> Hello JS
                    <span class="difficulty-tag difficulty-easy">Easy</span>
                </button>
                <button class="activity-btn" data-activity="store-score" onclick="loadActivity('store-score')">
                    <i class="fas fa-cube"></i> Store Score
                    <span class="difficulty-tag difficulty-easy">Easy</span>
                </button>
                <button class="activity-btn" data-activity="add-numbers" onclick="loadActivity('add-numbers')">
                    <i class="fas fa-calculator"></i> Add Numbers
                    <span class="difficulty-tag difficulty-medium">Medium</span>
                </button>
                <button class="activity-btn" data-activity="greater-than" onclick="loadActivity('greater-than')">
                    <i class="fas fa-code-branch"></i> Greater Than
                    <span class="difficulty-tag difficulty-medium">Medium</span>
                </button>
                <button class="activity-btn" data-activity="repeat-message" onclick="loadActivity('repeat-message')">
                    <i class="fas fa-list-ol"></i> Repeat Message
                    <span class="difficulty-tag difficulty-hard">Hard</span>
                </button>
                <button class="activity-btn" data-activity="free-play" onclick="loadActivity('free-play')">
                    <i class="fas fa-play"></i> Free Play
                </button>
            </div>
        </div>

        <!-- Activity Banner (INSTRUCTIONS / GUIDE) -->
        <div class="activity-banner" id="activityBanner">
            <div class="activity-banner-info">
                <h4>
                    <i class="fas fa-code"></i>
                    <span id="bannerActivityName">Hello JS</span>
                    <span class="difficulty-tag difficulty-easy" id="bannerDifficulty">Easy</span>
                </h4>
                <p class="instructions" id="bannerInstructions">Build a JavaScript program that prints "Hello, JavaScript!"</p>
                <div class="activity-guide">
                    <span class="label"><i class="fas fa-lightbulb me-1"></i>Clue</span>
                    <p class="text" id="bannerGuide">Use console.log with a TEXT block connected inside it.</p>
                </div>
                <div class="expected-output-box">
                    <span class="label"><i class="fas fa-eye me-1"></i>Expected Output</span>
                    <span class="value" id="bannerExpectedOutput">"Hello, JavaScript!"</span>
                </div>
            </div>
            <button class="btn-clear-activity" onclick="clearWorkspace()">
                <i class="fas fa-times me-1"></i> Clear
            </button>
        </div>

        <!-- Workspace Panel -->
        <div class="workspace-panel">
            <div class="workspace-toolbar">
                <span class="lang-badge"><i class="fab fa-js me-1"></i> JavaScript</span>
                <div class="actions">
                    <button class="btn-clear" onclick="clearWorkspace()"><i class="fas fa-trash-alt me-1"></i> Clear</button>
                    <button class="btn-run" onclick="runCode()"><i class="fas fa-play me-1"></i> Run</button>
                    <button class="btn-submit" onclick="submitCode()"><i class="fas fa-paper-plane me-1"></i> Submit</button>
                </div>
            </div>
            <div class="workspace-wrapper">
                <div id="blocklyDiv"></div>
            </div>
            <!-- Output Panel -->
            <div class="output-panel">
                <div class="output-row">
                    <div class="output-col">
                        <div class="label"><i class="fas fa-terminal me-1"></i> Your Output</div>
                        <div class="output-text" id="outputArea">Run your code to see output</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toastBox"></div>

    <script>
        // ============================================================
        // BLOCK REGISTRATION
        // ============================================================
        console.log('Blockly version:', Blockly.version || 'unknown');

        Blockly.Blocks['js_print'] = {
            init: function() {
                this.appendValueInput('TEXT').setCheck(['String', 'Number']).appendField('console.log');
                this.setInputsInline(true);
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour('#f7df1e');
                this.setTooltip('Print to console in JavaScript');
            }
        };

        Blockly.Blocks['js_set'] = {
            init: function() {
                this.appendDummyInput().appendField('let').appendField(new Blockly.FieldTextInput('name'), 'NAME').appendField('=');
                this.appendValueInput('VALUE');
                this.setInputsInline(true);
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour('#8b5cf6');
                this.setTooltip('Create a JavaScript variable');
            }
        };

        Blockly.Blocks['js_get'] = {
            init: function() {
                this.appendDummyInput().appendField('get variable').appendField(new Blockly.FieldTextInput('name'), 'NAME');
                this.setOutput(true, ['String', 'Number']);
                this.setColour('#8b5cf6');
                this.setTooltip('Get variable value');
            }
        };

        Blockly.Blocks['js_math'] = {
            init: function() {
                this.appendValueInput('A').setCheck('Number').appendField('math');
                this.appendDummyInput().appendField(new Blockly.FieldDropdown([
                    ['+', 'ADD'], ['-', 'SUBTRACT'], ['×', 'MULTIPLY'], ['÷', 'DIVIDE']
                ]), 'OP');
                this.appendValueInput('B').setCheck('Number').appendField('');
                this.setInputsInline(true);
                this.setOutput(true, 'Number');
                this.setColour('#10b981');
                this.setTooltip('Perform math operation');
            }
        };

        Blockly.Blocks['js_number'] = {
            init: function() {
                this.appendDummyInput().appendField(new Blockly.FieldNumber(0, -Infinity, Infinity, 1), 'NUM');
                this.setOutput(true, 'Number');
                this.setColour('#10b981');
                this.setTooltip('A number');
            }
        };

        Blockly.Blocks['js_text'] = {
            init: function() {
                this.appendDummyInput().appendField(new Blockly.FieldTextInput(''), 'TEXT');
                this.setOutput(true, 'String');
                this.setColour('#8b5cf6');
                this.setTooltip('A text string');
            }
        };

        Blockly.Blocks['js_if'] = {
            init: function() {
                this.appendValueInput('IF0').setCheck('Boolean').appendField('if');
                this.appendStatementInput('DO0').appendField('then');
                this.appendStatementInput('ELSE').appendField('else');
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour('#f0b84d');
                this.setTooltip('If-Else statement in JavaScript');
            }
        };

        Blockly.Blocks['js_compare'] = {
            init: function() {
                this.appendValueInput('A').setCheck(['Number', 'String']);
                this.appendDummyInput().appendField(new Blockly.FieldDropdown([
                    ['=', 'EQ'], ['≠', 'NEQ'], ['>', 'GT'], ['<', 'LT'], ['≥', 'GTE'], ['≤', 'LTE']
                ]), 'OP');
                this.appendValueInput('B').setCheck(['Number', 'String']);
                this.setInputsInline(true);
                this.setOutput(true, 'Boolean');
                this.setColour('#f0b84d');
                this.setTooltip('Compare two values');
            }
        };

        Blockly.Blocks['js_for'] = {
            init: function() {
                this.appendDummyInput().appendField('for (let ').appendField(new Blockly.FieldTextInput('i'), 'VAR').appendField('=');
                this.appendValueInput('FROM').setCheck('Number');
                this.appendDummyInput().appendField('; ').appendField(new Blockly.FieldTextInput('i'), 'VAR2').appendField('<= ');
                this.appendValueInput('TO').setCheck('Number');
                this.appendDummyInput().appendField('; ').appendField(new Blockly.FieldTextInput('i'), 'VAR3').appendField('++) {');
                this.appendStatementInput('DO').appendField('body');
                this.appendDummyInput().appendField('}');
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour('#d97706');
                this.setTooltip('For loop in JavaScript');
            }
        };

        // ============================================================
        // JAVASCRIPT GENERATORS
        // ============================================================
        if (typeof Blockly.JavaScript === 'undefined') {
            try {
                var jsGenerator = Blockly.Generator.getGenerator('JavaScript');
                if (jsGenerator) {
                    for (var key in jsGenerator) {
                        Blockly.JavaScript = Blockly.JavaScript || {};
                        Blockly.JavaScript[key] = jsGenerator[key];
                    }
                }
            } catch(e) { console.error('Failed to get JavaScript generator:', e); }
        }

        if (Blockly.JavaScript) {
            Blockly.JavaScript['js_print'] = function(block) {
                var text = Blockly.JavaScript.valueToCode(block, 'TEXT', Blockly.JavaScript.ORDER_ATOMIC) || '""';
                return 'console.log(' + text + ');\n';
            };
            Blockly.JavaScript['js_set'] = function(block) {
                var name = block.getFieldValue('NAME');
                var value = Blockly.JavaScript.valueToCode(block, 'VALUE', Blockly.JavaScript.ORDER_ATOMIC) || '""';
                return 'let ' + name + ' = ' + value + ';\n';
            };
            Blockly.JavaScript['js_get'] = function(block) {
                var name = block.getFieldValue('NAME');
                return [name, Blockly.JavaScript.ORDER_ATOMIC];
            };
            Blockly.JavaScript['js_math'] = function(block) {
                var a = Blockly.JavaScript.valueToCode(block, 'A', Blockly.JavaScript.ORDER_ATOMIC) || '0';
                var b = Blockly.JavaScript.valueToCode(block, 'B', Blockly.JavaScript.ORDER_ATOMIC) || '0';
                var op = block.getFieldValue('OP');
                var symbol = op === 'ADD' ? '+' : op === 'SUBTRACT' ? '-' : op === 'MULTIPLY' ? '*' : '/';
                return ['(' + a + ' ' + symbol + ' ' + b + ')', Blockly.JavaScript.ORDER_ATOMIC];
            };
            Blockly.JavaScript['js_number'] = function(block) {
                return [block.getFieldValue('NUM'), Blockly.JavaScript.ORDER_ATOMIC];
            };
            Blockly.JavaScript['js_text'] = function(block) {
                var text = block.getFieldValue('TEXT') || '';
                return ['"' + text + '"', Blockly.JavaScript.ORDER_ATOMIC];
            };
            Blockly.JavaScript['js_compare'] = function(block) {
                var a = Blockly.JavaScript.valueToCode(block, 'A', Blockly.JavaScript.ORDER_ATOMIC) || '0';
                var b = Blockly.JavaScript.valueToCode(block, 'B', Blockly.JavaScript.ORDER_ATOMIC) || '0';
                var op = block.getFieldValue('OP');
                var symbol = op === 'EQ' ? '==' : op === 'NEQ' ? '!=' : op === 'GT' ? '>' : op === 'LT' ? '<' : op === 'GTE' ? '>=' : '<=';
                return ['(' + a + ' ' + symbol + ' ' + b + ')', Blockly.JavaScript.ORDER_ATOMIC];
            };
            Blockly.JavaScript['js_if'] = function(block) {
                var condition = Blockly.JavaScript.valueToCode(block, 'IF0', Blockly.JavaScript.ORDER_ATOMIC) || 'false';
                var doCode = Blockly.JavaScript.statementToCode(block, 'DO0') || '';
                var elseCode = Blockly.JavaScript.statementToCode(block, 'ELSE') || '';
                var code = 'if (' + condition + ') {\n' + doCode + '}';
                if (elseCode) code += ' else {\n' + elseCode + '}';
                return code + '\n';
            };
            Blockly.JavaScript['js_for'] = function(block) {
                var varName = block.getFieldValue('VAR');
                var from = Blockly.JavaScript.valueToCode(block, 'FROM', Blockly.JavaScript.ORDER_ATOMIC) || '0';
                var to = Blockly.JavaScript.valueToCode(block, 'TO', Blockly.JavaScript.ORDER_ATOMIC) || '0';
                var doCode = Blockly.JavaScript.statementToCode(block, 'DO') || '';
                return 'for (let ' + varName + ' = ' + from + '; ' + varName + ' <= ' + to + '; ' + varName + '++) {\n' + doCode + '}\n';
            };
        }

        // ===== BLOCKLY SETUP =====
        let workspace;
        let currentActivity = 'hello-js';

        // ===== ACTIVITY CONFIGURATIONS =====
        const jsActivities = {
            'hello-js': {
                name: 'Hello JS',
                difficulty: 'Easy',
                step: 1,
                toolboxCategories: ['JavaScript Basic'],
                blocksXml: `<xml xmlns="https://developers.google.com/blockly/xml"></xml>`,
                instructions: `TASK: Print "Hello, JavaScript!" to the console.\n\nBLOCKS NEEDED: console.log, TEXT\n\nSTEPS:\n1. Drag console.log from BASIC\n2. Drag TEXT from BASIC and attach INSIDE console.log\n3. Type "Hello, JavaScript!" in TEXT\n4. Click RUN CODE`,
                guide: 'BASIC: connect a TEXT block inside console.log, then enter "Hello, JavaScript!".',
                expected: '"Hello, JavaScript!"'
            },
            'store-score': {
                name: 'Store Score',
                difficulty: 'Easy',
                step: 2,
                toolboxCategories: ['JavaScript Basic', 'JavaScript Variables', 'JavaScript Math'],
                blocksXml: `<xml xmlns="https://developers.google.com/blockly/xml"></xml>`,
                instructions: `TASK: Create a variable called "score" with value 90 and print it.\n\nBLOCKS NEEDED: let, console.log, NUMBER, GET VARIABLE\n\nSTEPS:\n1. Drag "let" from VARIABLES\n2. Change "name" to "score"\n3. Attach a NUMBER block from MATH with value 90\n4. Drag console.log from BASIC\n5. Drag GET VARIABLE from VARIABLES and attach INSIDE console.log\n6. Change GET VARIABLE to "score"\n7. Click RUN CODE`,
                guide: 'VARIABLES: set score to 90. BASIC: put get variable score inside console.log.',
                expected: '90'
            },
            'add-numbers': {
                name: 'Add Numbers',
                difficulty: 'Medium',
                step: 3,
                toolboxCategories: ['JavaScript Basic', 'JavaScript Math'],
                blocksXml: `<xml xmlns="https://developers.google.com/blockly/xml"></xml>`,
                instructions: `TASK: Add 25 and 15 and print the result.\n\nBLOCKS NEEDED: console.log, math operation, number\n\nSTEPS:\n1. Drag console.log from BASIC\n2. Inside console.log, add the math block from MATH and choose +\n3. Add two number blocks from MATH: 25 and 15\n4. Click RUN CODE`,
                guide: 'MATH: choose addition and connect 25 and 15. Put the math result inside BASIC console.log.',
                expected: '40'
            },
            'greater-than': {
                name: 'Greater Than',
                difficulty: 'Medium',
                step: 4,
                toolboxCategories: ['JavaScript Basic', 'JavaScript Math', 'JavaScript Logic'],
                blocksXml: `<xml xmlns="https://developers.google.com/blockly/xml"></xml>`,
                instructions: `TASK: Check if 20 is greater than 10. If true, print "20 is greater than 10".\n\nBLOCKS NEEDED: if, compare, console.log, number, text\n\nSTEPS:\n1. Drag if and compare from LOGIC; choose >\n2. Add number blocks from MATH: 20 and 10\n3. Inside if, add console.log from BASIC with a BASIC TEXT block containing "20 is greater than 10"\n4. Click RUN CODE`,
                guide: 'LOGIC: compare 20 > 10. Inside IF, place BASIC console.log with the message in a TEXT block.',
                expected: '20 is greater than 10'
            },
            'repeat-message': {
                name: 'Repeat Message',
                difficulty: 'Hard',
                step: 5,
                toolboxCategories: ['JavaScript Basic', 'JavaScript Loops'],
                blocksXml: `<xml xmlns="https://developers.google.com/blockly/xml"></xml>`,
                instructions: `TASK: Print "I love programming!" five times using a for loop.\n\nBLOCKS NEEDED: for loop, console.log, number, text (LOOPS category)\n\nSTEPS:\n1. Drag the for loop from LOOPS\n2. Set counter to "i", from 0, and to 4\n3. Drag console.log from LOOPS into the loop's body\n4. Drag TEXT from LOOPS into the console.log input (not directly into the loop body)\n5. Set the text to "I love programming!"\n6. Click RUN CODE`,
                guide: 'LOOPS: repeat with counter i from 0 to 4. Inside the loop, place console.log with TEXT "I love programming!".',
                expected: 'I love programming!\nI love programming!\nI love programming!\nI love programming!\nI love programming!'
            },
            'free-play': {
                name: 'Free Play',
                difficulty: 'All Levels',
                step: 0,
                toolboxCategories: ['All'],
                blocksXml: `<xml xmlns="https://developers.google.com/blockly/xml"></xml>`,
                instructions: `TASK: Build anything you want!\n\nAvailable blocks:\nBASIC: console.log, TEXT\nMATH: math, number\nVARIABLES: let, get variable\nLOGIC: if, compare\nLOOPS: for loop\n\nTry creating:\n- Calculator with +, -, ×, ÷\n- Any math expression\n- Variables with different values\n- If-else conditions`,
                guide: 'Start with BASIC console.log and TEXT. Add MATH, VARIABLES, LOGIC, or LOOPS to build a larger program.',
                expected: 'Your Code'
            }
        };

        // ===== TOOLBOX GENERATOR =====
        function getJSToolbox(categories) {
            const allCategories = {
                'JavaScript Basic': `
                    <category name="BASIC" colour="#f7df1e">
                        <block type="js_print"></block>
                        <block type="js_text"></block>
                    </category>`,
                'JavaScript Math': `
                    <category name="MATH" colour="#10b981">
                        <block type="js_math"></block>
                        <block type="js_number"></block>
                    </category>`,
                'JavaScript Variables': `
                    <category name="VARIABLES" colour="#8b5cf6">
                        <block type="js_set"></block>
                        <block type="js_get"></block>
                    </category>`,
                'JavaScript Logic': `
                    <category name="LOGIC" colour="#f0b84d">
                        <block type="js_if"></block>
                        <block type="js_compare"></block>
                    </category>`,
                'JavaScript Loops': `
                    <category name="LOOPS" colour="#d97706">
                        <block type="js_for"></block>
                        <block type="js_number"></block>
                        <block type="js_print"></block>
                        <block type="js_text"></block>
                    </category>`
            };

            if (categories.includes('All')) {
                return `
                    <xml xmlns="https://developers.google.com/blockly/xml" id="toolbox" style="display: none;">
                        ${allCategories['JavaScript Basic']}
                        ${allCategories['JavaScript Math']}
                        ${allCategories['JavaScript Variables']}
                        ${allCategories['JavaScript Logic']}
                        ${allCategories['JavaScript Loops']}
                    </xml>`;
            }

            let toolboxXml = '<xml xmlns="https://developers.google.com/blockly/xml" id="toolbox" style="display: none;">';
            categories.forEach(cat => {
                if (allCategories[cat]) toolboxXml += allCategories[cat];
            });
            toolboxXml += '</xml>';
            return toolboxXml;
        }

        // ===== BLOCKLY INITIALIZATION =====
        function initBlockly(toolboxXml) {
            if (workspace) { workspace.dispose(); workspace = null; }

            workspace = Blockly.inject('blocklyDiv', {
                toolbox: toolboxXml,
                trashcan: true,
                zoom: { controls: true, wheel: true, startScale: 0.9 },
                renderer: 'zelos'
            });
            window.attachBlocklyCodePreview(
                workspace,
                'blocklyDiv',
                () => Blockly.JavaScript.workspaceToCode(workspace),
                'JavaScript'
            );

            setTimeout(() => {
                document.querySelectorAll('.blocklyTrash').forEach(el => {
                    el.style.opacity = '1';
                    el.style.transition = 'all 0.3s ease';
                });
            }, 200);

            window.addEventListener('resize', () => {
                if (workspace) Blockly.svgResize(workspace);
            });
        }

        // ===== ACTIVITY LOADING =====
        async function loadActivity(activityId, userInitiated = true) {
            const activity = jsActivities[activityId];
            if (!activity) return;
            try {
                await window.ActivitySession.start(activityId, userInitiated);
            } catch (error) {
                showToast(error.message, 'error');
                return;
            }
            currentActivity = activityId;

            document.querySelectorAll('.activity-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.activity === activityId);
            });

            document.getElementById('bannerActivityName').textContent = activity.name;
            
            const diffTag = document.getElementById('bannerDifficulty');
            diffTag.textContent = activity.difficulty;
            diffTag.className = 'difficulty-tag';
            if (activity.difficulty === 'Easy') diffTag.classList.add('difficulty-easy');
            else if (activity.difficulty === 'Medium') diffTag.classList.add('difficulty-medium');
            else if (activity.difficulty === 'Hard') diffTag.classList.add('difficulty-hard');
            else diffTag.classList.add('difficulty-easy');
            
            const taskPrompt = activity.instructions.split(/\n\s*\n/)[0].replace(/^TASK:\s*/, '');
            document.getElementById('bannerInstructions').textContent = taskPrompt;
            document.getElementById('bannerGuide').textContent = activity.guide;
            document.getElementById('bannerExpectedOutput').textContent = activity.expected || '—';

            const toolboxXml = getJSToolbox(activity.toolboxCategories);
            initBlockly(toolboxXml);

            setTimeout(() => {
                try {
                    if (workspace && activity.blocksXml) {
                        const xmlDom = Blockly.Xml.textToDom(activity.blocksXml);
                        Blockly.Xml.domToWorkspace(xmlDom, workspace);
                        Blockly.svgResize(workspace);
                    }
                    document.getElementById('outputArea').textContent = 'Run your code to see output';
                    document.getElementById('outputArea').className = 'output-text';
                } catch(e) { console.error('Failed to load activity blocks:', e); }
            }, 100);
        }

        // ===== WORKSPACE CONTROLS =====
        function clearWorkspace() {
            if (confirm('Clear all blocks from workspace?')) {
                try {
                    if (workspace) {
                        workspace.clear();
                        document.getElementById('outputArea').textContent = 'Workspace cleared';
                        document.getElementById('outputArea').className = 'output-text';
                    }
                } catch(e) { console.error('Error clearing workspace:', e); }
            }
        }

        // ===== RUN CODE =====
        function runCode() {
            const outputArea = document.getElementById('outputArea');
            try {
                if (!workspace) {
                    outputArea.textContent = 'Workspace not initialized.';
                    outputArea.className = 'output-text error';
                    return;
                }
                if (typeof Blockly.JavaScript === 'undefined') {
                    outputArea.textContent = 'JavaScript generator not available.';
                    outputArea.className = 'output-text error';
                    return;
                }

                let code = Blockly.JavaScript.workspaceToCode(workspace);

                if (!code || code.trim() === '') {
                    outputArea.textContent = 'No code to run. Build your solution first!';
                    outputArea.className = 'output-text error';
                    return;
                }

                const originalConsoleLog = console.log;
                window.lastJsOutput = '';

                try {
                    let consoleOutput = [];
                    console.log = function(...args) { consoleOutput.push(args.join(' ')); };

                    eval(code);

                    if (consoleOutput.length > 0) {
                        window.lastJsOutput = consoleOutput.join('\n');
                        outputArea.textContent = consoleOutput.join('\n');
                        outputArea.className = 'output-text success';
                    } else {
                        outputArea.textContent = 'Code ran successfully but no output was printed.';
                        outputArea.className = 'output-text';
                    }
                } catch(e) {
                    outputArea.textContent = 'Execution error: ' + e.message;
                    outputArea.className = 'output-text error';
                } finally {
                    console.log = originalConsoleLog;
                }
            } catch(e) {
                outputArea.textContent = 'Error: ' + e.message;
                outputArea.className = 'output-text error';
            }
        }

        // ===== SUBMIT CODE =====
        function submitCode() {
            if (!workspace) { alert('Workspace not ready.'); return; }
            if (typeof Blockly.JavaScript === 'undefined') { alert('JavaScript generator not available.'); return; }

            let code = Blockly.JavaScript.workspaceToCode(workspace).trim();
            if (!code) { alert('Build your solution before submitting!'); return; }

            const activityNumbers = {
                'hello-js': 1,
                'store-score': 2,
                'add-numbers': 3,
                'greater-than': 4,
                'repeat-message': 5
            };
            const assessmentNumber = activityNumbers[currentActivity];
            if (!assessmentNumber) {
                alert('Free Play cannot be submitted as an assessment.');
                return;
            }

            const codeBlocks = Blockly.Xml.domToText(Blockly.Xml.workspaceToDom(workspace));
            const output = window.lastJsOutput || '';

            const submitBtn = document.querySelector('.btn-submit');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Submitting...';
            submitBtn.disabled = true;

            fetch('/submit_activity', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    language: 'javascript',
                    assessment_number: assessmentNumber,
                    code_blocks: codeBlocks,
                    generated_code: code,
                    output: output,
                    duration_seconds: window.getLearningDurationSeconds()
                })
            })
            .then(response => {
                if (!response.ok) return response.text().then(text => { throw new Error(text || `HTTP ${response.status}`); });
                return response.json();
            })
            .then(async result => {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;

                if (result.success) {
                    const earnedPoints = result.points || 0;
                    const maxPoints = result.max_points || 0;
                    window.showScoreAttemptFeedback(result, result.activity_title || currentActivity);
                    await window.ActivitySession.submitted(result);
                    showToast(`Submitted ${earnedPoints}/${maxPoints}`, result.points === result.max_points ? 'success' : 'error');
                    try { localStorage.setItem('student_dashboard_refresh', Date.now().toString()); } catch(e) {}
                    try { localStorage.setItem('progress_updated', Date.now().toString()); } catch(e) {}
                } else {
                    showToast(result.message || 'Submission failed.', 'error');
                }
            })
            .catch(error => {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
                console.error('Submit activity failed:', error);
                showToast('Unable to submit. Please try again.', 'error');
            });
        }

        // ===== TOAST =====
        function showToast(message, type) {
            const box = document.getElementById('toastBox');
            const toast = document.createElement('div');
            toast.className = 'toast-msg ' + type;
            toast.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${message}`;
            box.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(40px)';
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        }

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('Page loaded - initializing...');
            const requestedActivity = new URLSearchParams(window.location.search).get('activity');
            const activityId = Object.prototype.hasOwnProperty.call(jsActivities, requestedActivity)
                ? requestedActivity
                : 'hello-js';
            await window.ActivitySession.initialize('javascript', jsActivities);
            loadActivity(activityId, false);
        });
    </script>
</body>
